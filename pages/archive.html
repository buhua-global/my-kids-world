<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      try {
        var t = localStorage.getItem("dw-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../css/themes/journal.css" />
  <link rel="stylesheet" href="../css/themes/dream.css" />
  <link rel="stylesheet" href="../css/themes/minimal.css" />
  <link rel="stylesheet" href="../css/themes/vintage.css" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
  <nav class="topnav">
    <div class="wrap">
      <a class="nav-brand" href="../index.html"><svg class="logo" viewBox="0 0 26 26" aria-hidden="true" focusable="false"><path d="M13 2.5c.7 2.8 2.2 4.3 5 5-2.8.7-4.3 2.2-5 5-.7-2.8-2.2-4.3-5-5 2.8-.7 4.3-2.2 5-5z" fill="var(--primary)"/><path d="M19.5 13.5c.5 1.9 1.5 2.9 3.4 3.4-1.9.5-2.9 1.5-3.4 3.4-.5-1.9-1.5-2.9-3.4-3.4 1.9-.5 2.9-1.5 3.4-3.4z" fill="var(--accent)"/><circle cx="7" cy="18.5" r="2.6" fill="var(--accent-2)"/></svg>女儿的世界</a>
      <div class="nav-links">
        <a class="nav-link" href="../index.html">首页</a>
        <a class="nav-link active" href="archive.html">女儿的小宇宙</a>
        <a class="nav-link" href="guide.html">对话指南</a>
        <a class="nav-link" href="glossary.html">黑话词典</a>
      </div>
      <div class="theme-zone">
        <button type="button" class="theme-btn" aria-label="切换主题" aria-haspopup="menu"><svg class="palette-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 1.8-.8 1.8-1.6 0-.7-.5-1.2-.5-1.9 0-.9.7-1.5 1.7-1.5h1.5A4.5 4.5 0 0 0 21 11.5C21 6.8 16.9 3 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7.5" cy="10.5" r="1.3" fill="var(--primary)"/><circle cx="12" cy="7.5" r="1.3" fill="var(--accent)"/><circle cx="16.5" cy="10.5" r="1.3" fill="var(--accent-2)"/></svg></button>
        <div class="theme-pop" role="menu" aria-label="选择主题"></div>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <header class="section">
      <a class="back-link" href="../index.html">← 回到首页</a>
      <div class="profile-head">
        <span class="avatar" id="p-avatar">🌸</span>
        <div>
          <div class="p-name" id="p-name">女儿</div>
          <div class="p-intro" id="p-intro"></div>
        </div>
      </div>
      <div class="chips" id="p-tags"></div>
    </header>

    <div id="example-banner"></div>

    <!-- ---------- 浏览模式 ---------- -->
    <div id="view-mode">
      <section class="section reveal">
        <h2 class="section-title">她喜欢什么</h2>
        <div class="kv-list" id="p-kv"></div>
      </section>

      <section class="section reveal">
        <h2 class="section-title">最近在追</h2>
        <p class="section-desc">随口一记就好，不用写成观察日记。</p>
        <ul class="timeline" id="p-recent"></ul>
        <div class="form-actions">
          <input type="text" id="r-text" placeholder="比如：最近在追《xxx》，还买了吧唧" aria-label="记一笔最近在追的" />
          <button type="button" class="btn" id="r-add">记一笔</button>
        </div>
      </section>

      <section class="section reveal">
        <h2 class="section-title">给自己的便签</h2>
        <div class="card">
          <p id="p-notes" class="mt-0"></p>
        </div>
      </section>

      <section class="section reveal">
        <div class="form-actions">
          <button type="button" class="btn btn-primary" id="btn-edit">✏️ 编辑档案</button>
          <button type="button" class="btn btn-ghost" id="btn-clear" hidden>清空档案，回到示例</button>
        </div>
      </section>
    </div>

    <!-- ---------- 编辑模式 ---------- -->
    <div id="edit-mode" hidden>
      <form id="edit-form">
        <div class="form-grid">
          <div class="field">
            <label for="f-nickname">小名或昵称</label>
            <input type="text" id="f-nickname" maxlength="12" placeholder="比如：小满" />
          </div>
          <div class="field">
            <label for="f-grade">年级<span class="field-hint">决定模块页默认展示哪个学段</span></label>
            <select id="f-grade">
              <option value="幼儿园">幼儿园</option>
              <option value="一年级">一年级</option>
              <option value="二年级">二年级</option>
              <option value="三年级">三年级</option>
              <option value="四年级">四年级</option>
              <option value="五年级">五年级</option>
              <option value="六年级">六年级</option>
              <option value="初一">初一</option>
              <option value="初二">初二</option>
              <option value="初三">初三</option>
              <option value="高一">高一</option>
              <option value="高二">高二</option>
              <option value="高三">高三</option>
            </select>
          </div>
          <div class="field span-2">
            <label>她的派系<span class="field-hint">大致归个类就好——也可以是几种的混合，选「综合型」或先空着都行</span></label>
            <div class="chips" id="f-faction"></div>
          </div>
          <div class="field span-2">
            <label>她的标签<span class="field-hint">点选几个，也可以都不选</span></label>
            <div class="chips" id="f-tags"></div>
          </div>
          <div class="field span-2">
            <label for="f-intro">一句话介绍她</label>
            <input type="text" id="f-intro" maxlength="40" placeholder="比如：一个喜欢画画和看番的女孩" />
          </div>
          <div class="field">
            <label for="f-works">喜欢的作品<span class="field-hint">用顿号或逗号分开</span></label>
            <input type="text" id="f-works" placeholder="《排球少年》、名侦探柯南" />
          </div>
          <div class="field">
            <label for="f-idol">喜欢的爱豆 / 人物</label>
            <input type="text" id="f-idol" placeholder="没有就空着" />
          </div>
          <div class="field">
            <label for="f-games">玩的游戏</label>
            <input type="text" id="f-games" placeholder="原神、蛋仔派对" />
          </div>
          <div class="field">
            <label for="f-music">常听的音乐</label>
            <input type="text" id="f-music" placeholder="K-pop、周杰伦" />
          </div>
          <div class="field span-2">
            <label for="f-notes">给自己的便签<span class="field-hint">只给你自己看</span></label>
            <textarea id="f-notes" placeholder="比如：她提过想学数位板画画，也许生日可以留意"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" class="btn btn-ghost" id="btn-cancel">取消</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    女儿的世界 v0.1 · 数据仅保存在本机浏览器 · to know is to see
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/archive.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/page-archive.js"></script>
</body>
</html>
